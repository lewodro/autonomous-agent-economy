name: Offline validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: stable
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm test
      - run: npm run typecheck
      - run: npm run check
      - run: npm run docs:check
      - run: npm run examples:check
      - run: npm run verify:production
        env:
          NODE_ENV: production
          PUBLIC_ORIGIN: https://ci.example
          MATCHES_DIR: ${{ runner.temp }}
          HOST_SESSION_SECRET: ci-only-host-session-secret-000000000000
      - run: npm run demo:crypto
      - run: npm run demo:economy
      - run: npm run demo:economy -- examples/economy/free.json
      - run: npm run demo:economy -- examples/economy/mock-0.05.json
      - run: npm run demo:funded-local -- --mode mock
        env:
          ECONOMY_DIR: ${{ runner.temp }}/durable-funded-demo
      - run: npm run demo:solana
      - run: npm run simulate -- --agents 2 --mode survival --bankroll 0.09 --stake 0.03 --seed 9 --rounds 300 --out /tmp/arena-audit.json
      - run: npm run verify -- /tmp/arena-audit.json
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: stable
          components: clippy, rustfmt
      - run: cargo fmt --manifest-path rust/Cargo.toml --check
      - run: cargo clippy --manifest-path rust/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path rust/Cargo.toml --locked
      - run: cargo test --release --manifest-path rust/Cargo.toml --locked maximum_size_match_is_replayable_within_transport_limits -- --ignored
      - run: cargo run --manifest-path rust/Cargo.toml --locked --bin table-core > /tmp/match.json
      - run: cargo run --manifest-path rust/Cargo.toml --locked --bin wallet-demo
